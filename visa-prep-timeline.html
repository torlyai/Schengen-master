<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>France Schengen Visa — Preparation Timeline</title>
<style>
  :root {
    --fg: #111827;
    --fg-faded: #6b7280;
    --line: #d1d5db;
    --accent: #1d4ed8;
    --accent-bg: #eff6ff;
    --page: #ffffff;
  }
  html, body { margin: 0; padding: 0; background: var(--page); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 32px 28px 60px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 6px; text-align: center; }
  .sub { font-size: 13px; color: var(--fg-faded); text-align: center; margin: 0 0 26px; }
  .legend { display: flex; gap: 18px; justify-content: center; margin-bottom: 28px; font-size: 12px; color: var(--fg-faded); }
  .legend .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: middle; margin-right: 6px; }
  .legend .dot.done { background: var(--fg-faded); }
  .legend .dot.today { background: var(--accent); width: 12px; height: 12px; }
  .legend .dot.upcoming { background: transparent; border: 1.5px solid var(--fg-faded); }
  svg { display: block; margin: 0 auto; }
  .footer { margin-top: 32px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 12px; color: var(--fg-faded); text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>France Schengen Visa — Preparation Timeline</h1>
  <p class="sub">XU / HUANG family · Application submitted at TLScontact Manchester on Sat 23 May 2026</p>
  <div class="legend">
    <span><span class="dot done"></span>completed</span>
    <span><span class="dot today"></span>today</span>
    <span><span class="dot upcoming"></span>upcoming</span>
  </div>

  <svg viewBox="0 0 820 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="820" height="760">

    <line x1="240" y1="20" x2="240" y2="530" stroke="#6b7280" stroke-width="1.5" opacity="0.5" />
    <line x1="240" y1="530" x2="240" y2="730" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4" />

    <!-- Phase 1 -->
    <circle cx="240" cy="50" r="6" fill="#6b7280" />
    <text x="228" y="45" text-anchor="end" font-size="11" font-weight="500" fill="#111827">Apr – early May</text>
    <text x="228" y="60" text-anchor="end" font-size="11" fill="#6b7280">2026</text>
    <text x="256" y="45" font-size="13" font-weight="600" fill="#111827">1. TLS appointment slot acquired</text>
    <text x="256" y="62" font-size="11" fill="#6b7280">Visa Master Chrome extension polled TLScontact Manchester every 4 min;</text>
    <text x="256" y="77" font-size="11" fill="#6b7280">a Saturday family slot opened and was booked for 23 May 2026.</text>

    <!-- Phase 2 -->
    <circle cx="240" cy="130" r="6" fill="#6b7280" />
    <text x="228" y="125" text-anchor="end" font-size="11" font-weight="500" fill="#111827">12 May 2026</text>
    <text x="256" y="125" font-size="13" font-weight="600" fill="#111827">2. Trip dates &amp; main destination locked</text>
    <text x="256" y="142" font-size="11" fill="#6b7280">15 Aug – 3 Sep 2026 (19 nights); France set as main destination.</text>
    <text x="256" y="157" font-size="11" fill="#6b7280">First-draft split: Paris 6 / Avignon 4 / Nice 4 / Florence 2 / Rome 3.</text>

    <!-- Phase 3 -->
    <circle cx="240" cy="200" r="6" fill="#6b7280" />
    <text x="228" y="195" text-anchor="end" font-size="11" font-weight="500" fill="#111827">18 – 19 May</text>
    <text x="228" y="210" text-anchor="end" font-size="11" fill="#6b7280">2026</text>
    <text x="256" y="195" font-size="13" font-weight="600" fill="#111827">3. Supporting docs collected</text>
    <text x="256" y="212" font-size="11" fill="#6b7280">Gateways School enrolment letter (18 May) confirming daughter's return date;</text>
    <text x="256" y="227" font-size="11" fill="#6b7280">Aphrodite Fashion Certificate of Employment (19 May) confirming role &amp; salary.</text>

    <!-- Phase 4 -->
    <circle cx="240" cy="280" r="6" fill="#6b7280" />
    <text x="228" y="275" text-anchor="end" font-size="11" font-weight="500" fill="#111827">22 May 2026</text>
    <text x="256" y="275" font-size="13" font-weight="600" fill="#111827">4. Itinerary simplified &amp; bookings finalised</text>
    <text x="256" y="292" font-size="11" fill="#6b7280">Avignon &amp; Florence dropped; cities consolidated to Paris 6 / Nice 7 / Rome 6.</text>
    <text x="256" y="307" font-size="11" fill="#6b7280">3 hotels, 2 Eurostars + 1 Air France flight, travel insurance secured.</text>

    <!-- Phase 5 -->
    <circle cx="240" cy="360" r="6" fill="#6b7280" />
    <text x="228" y="355" text-anchor="end" font-size="11" font-weight="500" fill="#111827">22 May 2026</text>
    <text x="256" y="355" font-size="13" font-weight="600" fill="#111827">5. Application pack assembled</text>
    <text x="256" y="372" font-size="11" fill="#6b7280">Single-page visa itinerary document built; 3 individual cover letters drafted</text>
    <text x="256" y="387" font-size="11" fill="#6b7280">(father, mother, daughter), each tailored to the applicant's funding &amp; ties.</text>

    <!-- Phase 6 — submission (TODAY, accent) -->
    <rect x="226" y="420" width="28" height="28" rx="4" fill="#1d4ed8" />
    <text x="240" y="439" text-anchor="middle" font-size="14" font-weight="700" fill="white">✓</text>
    <text x="216" y="430" text-anchor="end" font-size="11" font-weight="600" fill="#1d4ed8">23 May 2026</text>
    <text x="216" y="445" text-anchor="end" font-size="11" font-weight="500" fill="#1d4ed8">— today —</text>
    <text x="266" y="430" font-size="14" font-weight="700" fill="#1d4ed8">6. SUBMITTED at TLScontact Manchester</text>
    <text x="266" y="448" font-size="11" fill="#6b7280">Paper pack handed in; biometrics taken; file forwarded</text>
    <text x="266" y="463" font-size="11" fill="#6b7280">to the French Consulate General in London for adjudication.</text>

    <!-- Phase 7 — upcoming -->
    <circle cx="240" cy="520" r="6" fill="white" stroke="#6b7280" stroke-width="1.5" />
    <text x="228" y="515" text-anchor="end" font-size="11" font-weight="500" fill="#111827">~22 Jun 2026</text>
    <text x="256" y="515" font-size="13" font-weight="600" fill="#111827">7. Decision expected (~15-30 days)</text>
    <text x="256" y="532" font-size="11" fill="#6b7280">Consulate processes within 15-30 calendar days;</text>
    <text x="256" y="547" font-size="11" fill="#6b7280">passport returned to the UK via TLS courier.</text>

    <!-- Phase 8 — trip -->
    <circle cx="240" cy="610" r="6" fill="white" stroke="#6b7280" stroke-width="1.5" />
    <text x="228" y="605" text-anchor="end" font-size="11" font-weight="500" fill="#111827">15 Aug 2026</text>
    <text x="256" y="605" font-size="13" font-weight="600" fill="#111827">8. Trip begins</text>
    <text x="256" y="622" font-size="11" fill="#6b7280">Eurostar London St Pancras 12:31 → Paris Gare du Nord 15:59.</text>
    <text x="256" y="637" font-size="11" fill="#6b7280">Return Thu 3 Sep 2026, Eurostar 21:02 → London 22:30.</text>

    <!-- Phase 9 — return -->
    <circle cx="240" cy="700" r="6" fill="white" stroke="#6b7280" stroke-width="1.5" />
    <text x="228" y="695" text-anchor="end" font-size="11" font-weight="500" fill="#111827">3 Sep 2026</text>
    <text x="256" y="695" font-size="13" font-weight="600" fill="#111827">9. Trip ends — family returns to UK</text>
    <text x="256" y="712" font-size="11" fill="#6b7280">19 nights in Schengen area (13 France + 6 Italy).</text>
  </svg>

  <p class="footer">Saved to <code>Schengen-visa/visa-prep-timeline.html</code> · Compiled from session notes &amp; documents in <code>Schengen-visa/forms/</code></p>
</div>
